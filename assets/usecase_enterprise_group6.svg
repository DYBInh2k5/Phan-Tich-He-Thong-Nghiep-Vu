  <!-- RELATIONSHIPS: INCLUDE & EXTEND (PROPER ARROWS) -->
  <!-- UC-SALES-04 <<include>> UC-SALES-01 -->
  <path d="M 390 284 L 390 141" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow-blue)"/>
  <rect x="345" y="145" width="90" height="16" fill="#FFFFFF" stroke="#BFDBFE" rx="3"/>
  <text x="390" y="157" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="bold" fill="#2563EB">«include»</text>

  <!-- UC-SALES-03 <<extend>> UC-SALES-04 -->
  <path d="M 390 264 L 390 282" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow-red)"/>
  <rect x="290" y="268" width="200" height="16" fill="#FFFFFF" stroke="#FECDD3" rx="3"/>
  <text x="390" y="280" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="bold" fill="#DC2626">«extend» [Discount &gt; 5%]</text>

  <!-- UC-ACC-02 <<extend>> UC-SALES-04 -->
  <path d="M 600 145 C 520 180, 480 240, 480 285" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow-red)"/>
  <rect x="470" y="210" width="165" height="16" fill="#FFFFFF" stroke="#FECDD3" rx="3"/>
  <text x="552" y="222" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="bold" fill="#DC2626">«extend» [Overdue &gt; 30d]</text>

  <!-- UC-ACC-03 <<include>> UC-ACC-01 -->
